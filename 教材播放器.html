<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好好生活常規</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <header>
    <h1>好好生活常規</h1>
    <div class="page-count" id="pageCount">1 / 15</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:'頁面截圖/000_我會這樣做.png', audio:'assets/audio/p00.mp3', label:'我會這樣做'},
    {img:'頁面截圖/001_我要好好坐校車.png', audio:'assets/audio/p01.mp3', label:'我要好好坐校車'},
    {img:'頁面截圖/002_我要好好進教室.png', audio:'assets/audio/p02.mp3', label:'我要好好進教室'},
    {img:'頁面截圖/003_我要好好上廁所.png', audio:'assets/audio/p03.mp3', label:'我要好好上廁所'},
    {img:'頁面截圖/004_我要好好運動.png', audio:'assets/audio/p04.mp3', label:'我要好好運動'},
    {img:'頁面截圖/005_我要好好騎腳踏車.png', audio:'assets/audio/p05.mp3', label:'我要好好騎腳踏車'},
    {img:'頁面截圖/006_我要好好上課.png', audio:'assets/audio/p06.mp3', label:'我要好好上課'},
    {img:'頁面截圖/007_我要好好吃點心.png', audio:'assets/audio/p07.mp3', label:'我要好好吃點心'},
    {img:'頁面截圖/008_我要好好看電視.png', audio:'assets/audio/p08.mp3', label:'我要好好看電視'},
    {img:'頁面截圖/009_我要好好寫字.png', audio:'assets/audio/p09.mp3', label:'我要好好寫字'},
    {img:'頁面截圖/010_我要好好說話.png', audio:'assets/audio/p10.mp3', label:'我要好好說話'},
    {img:'頁面截圖/011_我要好好操作.png', audio:'assets/audio/p11.mp3', label:'我要好好操作'},
    {img:'頁面截圖/012_我要好好喝水.png', audio:'assets/audio/p12.mp3', label:'我要好好喝水'},
    {img:'頁面截圖/013_我要好好走路.png', audio:'assets/audio/p13.mp3', label:'我要好好走路'},
    {img:'頁面截圖/014_我要好好練習.png', audio:'assets/audio/p14.mp3', label:'我要好好練習'},
    {img:'頁面截圖/015_我要好好坐好.png', audio:'assets/audio/p15.mp3', label:'我要好好坐好'},
    {img:'頁面截圖/016_我要好好休息.png', audio:'assets/audio/p16.mp3', label:'我要好好休息'},
    {img:'頁面截圖/017_我要好好吃飯.png', audio:'assets/audio/p17.mp3', label:'我要好好吃飯'},
    {img:'頁面截圖/018_我要好好喝湯.png', audio:'assets/audio/p18.mp3', label:'我要好好喝湯'},
    {img:'頁面截圖/019_我要好好刷牙.png', audio:'assets/audio/p19.mp3', label:'我要好好刷牙'},
    {img:'頁面截圖/020_我要好好睡覺.png', audio:'assets/audio/p20.mp3', label:'我要好好睡覺'},
    {img:'頁面截圖/021_我要好好參與活動.png', audio:'assets/audio/p21.mp3', label:'我要好好參與活動'},
    {img:'頁面截圖/022_我要好好收書包.png', audio:'assets/audio/p22.mp3', label:'我要好好收書包'},
    {img:'頁面截圖/023_我要好好放學.png', audio:'assets/audio/p23.mp3', label:'我要好好放學'},
    {img:'頁面截圖/024_我要好好控制.png', audio:'assets/audio/p24.mp3', label:'我要好好控制'},
    {img:'頁面截圖/025_我最棒.png', audio:'assets/audio/p25.mp3', label:'我最棒'},
  ];

  let current = 0;
  let audioUnlocked = false;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  function fitFrame(){
    const ratio = 16/9;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗，按「重複播放」按鈕還是能手動播放
      });
    }
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> goTo(current-1));
  nextBtn.addEventListener('click', ()=> goTo(current+1));
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight') goTo(current+1);
    else if (e.key === 'ArrowLeft') goTo(current-1);
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
